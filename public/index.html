<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#040714">
  <title>ARTIK LIVE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, rgba(255, 0, 98, .18), transparent 28%),
        radial-gradient(circle at top right, rgba(0, 221, 255, .13), transparent 24%),
        #040714;
    }
    .wrap { width: 100%; max-width: 520px; margin: 0 auto; }
    .hero { text-align: center; margin-bottom: 26px; }
    .avatar {
      display: block;
      width: 180px;
      height: 180px;
      max-width: 70vw;
      max-height: 70vw;
      margin: 18px auto;
      border-radius: 28px;
      object-fit: cover;
      border: 3px solid rgba(255, 63, 117, .34);
      box-shadow: 0 0 34px rgba(255, 45, 106, .45), 0 0 65px rgba(0, 229, 255, .15);
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, #16a34a, #22c55e);
      box-shadow: 0 10px 26px rgba(34, 197, 94, .2);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .title {
      margin: 8px 0 0;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: 1.5px;
      text-shadow: 0 0 24px rgba(0, 213, 255, .22);
    }
    .card {
      padding: 18px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 22px;
      background: rgba(15, 23, 42, .72);
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28);
    }
    .telegram-btn {
      display: flex;
      width: 100%;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(90deg, #7c3aed, #ec4899);
      box-shadow: 0 0 20px rgba(236, 72, 153, .32);
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .3px;
      transition: transform .15s ease, opacity .15s ease;
    }
    .telegram-btn:hover { transform: translateY(-1px); opacity: .96; }
    .telegram-btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="live-badge">● LIVE</div>
      <img class="avatar" src="/artik.jpg" alt="ARTIK">
      <h1 class="title">ARTIK LIVE</h1>
    </header>
    <section class="card" aria-label="Telegram">
      <a class="telegram-btn" href="https://t.me/XXXArtMafia" target="_blank" rel="noopener noreferrer">
        ✈️ TELEGRAM — ПРИЄДНАТИСЯ
      </a>
    </section>
  </main>
</body>
</html>
