<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08070d">
  <meta name="description" content="ARTIK LIVE — український TikTok-стример. Приєднуйся до спільноти в Telegram.">
  <title>ARTIK LIVE — Твоя атмосфера</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08070d;
      --pink: #ff2e75;
      --cyan: #25e7ff;
      --muted: #b9b5c8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: #fff;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 46, 117, .18), transparent 32%),
        radial-gradient(ellipse at 90% 30%, rgba(37, 231, 255, .13), transparent 34%),
        radial-gradient(ellipse at 50% 100%, rgba(111, 45, 255, .12), transparent 38%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 82%);
    }
    .page {
      position: relative;
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 22px 0 30px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 30px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 35px;
      height: 35px;
      border: 1px solid rgba(37,231,255,.55);
      border-radius: 12px;
      color: var(--cyan);
      background: rgba(37,231,255,.08);
      box-shadow: 0 0 22px rgba(37,231,255,.13);
      font-size: 19px;
    }
    .top-label {
      padding: 8px 11px;
      border: 1px solid rgba(255,46,117,.4);
      border-radius: 999px;
      color: #ffdce7;
      background: rgba(255,46,117,.08);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.4px;
      white-space: nowrap;
    }
    .hero { text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 19px;
      color: #e6e2f1;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .eyebrow::before, .eyebrow::after {
      content: "";
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan));
    }
    .eyebrow::after { transform: rotate(180deg); }
    .portrait-shell {
      position: relative;
      width: min(64vw, 238px);
      aspect-ratio: 1;
      margin: 0 auto 24px;
      padding: 5px;
      border-radius: 34% 34% 29% 29%;
      background: linear-gradient(145deg, var(--cyan), #4535a7 42%, var(--pink) 82%);
      box-shadow: 0 0 24px rgba(37,231,255,.20), 0 0 54px rgba(255,46,117,.16);
      animation: float 5s ease-in-out infinite;
    }
    .portrait-inner {
      width: 100%;
      height: 100%;
      padding: 5px;
      overflow: hidden;
      border-radius: inherit;
      background: #100d19;
    }
    .avatar {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }
    .orbit {
      position: absolute;
      z-index: -1;
      inset: -13px;
      border: 1px solid rgba(37,231,255,.23);
      border-radius: 38% 38% 32% 32%;
      transform: rotate(-8deg);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      color: #e7e3f1;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
    }
    h1 {
      margin: 15px 0 0;
      font-size: clamp(46px, 13vw, 78px);
      line-height: .92;
      font-weight: 1000;
      letter-spacing: -3px;
      text-transform: uppercase;
    }
    h1 .artik {
      display: block;
      color: #fff;
      text-shadow: 0 0 28px rgba(255,255,255,.12);
    }
    h1 .live {
      display: block;
      margin-top: 5px;
      color: transparent;
      background: linear-gradient(95deg, var(--cyan), #fff 42%, var(--pink) 82%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 0 19px rgba(255,46,117,.24));
    }
    .tagline {
      margin: 17px 0 27px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      font-weight: 700;
      letter-spacing: 2.1px;
    }
    .cta-wrap { margin: 0 auto; max-width: 480px; }
    .telegram-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 66px;
      padding: 17px 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 19px;
      color: #fff;
      background: linear-gradient(105deg, #0a9fdb 0%, #347dff 48%, #ed278b 100%);
      box-shadow: 0 9px 32px rgba(21,166,255,.23), 0 0 30px rgba(255,46,117,.13), inset 0 1px 0 rgba(255,255,255,.32);
      text-decoration: none;
      font-size: clamp(13px, 3.6vw, 16px);
      font-weight: 950;
      letter-spacing: .5px;
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
      isolation: isolate;
    }
    .telegram-btn::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: -80%;
      left: -35%;
      width: 25%;
      height: 260%;
      transform: rotate(25deg);
      background: rgba(255,255,255,.26);
      filter: blur(9px);
      animation: shine 5s ease-in-out infinite;
    }
    .telegram-btn:hover {
      transform: translateY(-3px);
      filter: saturate(1.18);
      box-shadow: 0 13px 38px rgba(21,166,255,.32), 0 0 34px rgba(255,46,117,.2);
    }
    .telegram-btn:active { transform: scale(.985); }
    .telegram-btn:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .telegram-icon {
      display: grid;
      place-items: center;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,.18);
      font-size: 20px;
    }
    .cta-arrow { margin-left: auto; font-size: 23px; }
    .under-cta {
      margin: 14px 0 0;
      color: #9e99b0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.6px;
    }
    .bottom-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-top: 28px;
      color: #777287;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 2px;
      text-align: center;
    }
    .bottom-line span { color: var(--pink); }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-7px) rotate(.5deg); } }
    @keyframes shine { 0%,65% { left: -35%; } 100% { left: 130%; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    @media (max-width: 380px) {
      .page { width: min(100% - 24px, 620px); padding-top: 16px; }
      .topbar { margin-bottom: 24px; }
      .top-label { font-size: 9px; letter-spacing: .8px; }
      h1 { letter-spacing: -2px; }
      .tagline { letter-spacing: 1.4px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand"><span class="brand-mark">A</span><span>ARTIK / LIVE</span></div>
      <div class="top-label">СВІТ TIKTOK LIVE</div>
    </div>

    <header class="hero">
      <p class="eyebrow">ТУТ ПОЧИНАЄТЬСЯ ДРАЙВ</p>

      <div class="portrait-shell">
        <div class="orbit"></div>
        <div class="portrait-inner">
          <img class="avatar" src="/artik.jpg" alt="Фото Артіка" fetchpriority="high">
        </div>
      </div>

      <div class="status"><span class="status-dot"></span> УКРАЇНСЬКИЙ СТРИМЕР</div>
      <h1><span class="artik">ARTIK</span><span class="live">LIVE</span></h1>
      <p class="tagline">БІЛЬШЕ НІЖ ЕФІРИ.<br>ЦЕ НАША СПІЛЬНОТА.</p>
    </header>

    <section class="cta-wrap" aria-label="Приєднання до Telegram">
      <a class="telegram-btn" href="https://t.me/XXXArtMafia" target="_blank" rel="noopener noreferrer">
        <span class="telegram-icon" aria-hidden="true">➤</span>
        <span>ПРИЄДНАТИСЯ ДО TELEGRAM</span>
        <span class="cta-arrow" aria-hidden="true">↗</span>
      </a>
      <p class="under-cta">НОВИНИ • СПІЛКУВАННЯ • НАШІ МОМЕНТИ</p>
    </section>

    <footer class="bottom-line">
      <span>✦</span> ARTIK LIVE <span>✦</span> УКРАЇНСЬКА СПІЛЬНОТА <span>✦</span>
    </footer>
  </main>
</body>
</html>
